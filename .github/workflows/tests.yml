name: Tests

on:
  push:
    branches: [main, nightly, develop, v2]
  pull_request:
    branches: [main, v2, dev]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: Unit tests
        run: go test -race ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Env reference is up to date
        run: go run . config --env-docs > /dev/null

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Install PostgreSQL clients 16, 17 and 18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16 postgresql-client-17 postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Build the image
        run: docker build --build-arg appVersion=ci -t jkaninda/pg-bkup:dev .
      - name: Integration tests (PostgreSQL 13, 16, 17, 18, MinIO, image)
        env:
          PG_BKUP_IMAGE: jkaninda/pg-bkup:dev
        run: go test -tags integration -count=1 -timeout 20m -v ./...
      - name: Miabi relies on /bin/sh in the image
        run: docker run --rm --entrypoint /bin/sh jkaninda/pg-bkup:dev -c 'rm -f /backup/x'
